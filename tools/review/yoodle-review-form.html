<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Yoodle review form</title></head>
<body>
<!-- Netlify reads this static form at deploy time so the "yoodle-review" form exists.
     yoodle-review.js posts to it. Do not delete; nobody needs to open this page. -->
<form name="yoodle-review" method="POST" enctype="multipart/form-data" data-netlify="true" netlify-honeypot="website" hidden>
  <input type="hidden" name="form-name" value="yoodle-review">
  <input name="website">
  <input name="project">
  <input name="page">
  <input name="url">
  <input name="number">
  <input name="reviewer">
  <input name="element">
  <input name="what">
  <input name="section">
  <textarea name="note"></textarea>
  <input name="viewport">
  <input name="position">
  <input name="device">
  <input name="created">
  <input name="photo_name">
  <input type="file" name="photo">
</form>
</body>
</html>
